[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "construction-order-cli"
version = "0.1.0"
description = "CLI application to create construction orders."
authors = [
    { name = "Vlad Korneev", email = "veenrok@veenrok.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "questionary>=2.1.1",
    "typer>=0.24.1",
]

[project.scripts]
cli = "app.cli:main"
